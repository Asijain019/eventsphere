# Database-only stack for local development (run the app on your machine with `npm run dev`):
#   docker compose -f docker-compose.dev.yml up -d
#   npm run db:migrate && npm run db:seed && npm run dev
name: eventsphere-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventsphere
      POSTGRES_PASSWORD: eventsphere
      POSTGRES_DB: eventsphere
    ports: ["5432:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsphere -d eventsphere"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata_dev:
